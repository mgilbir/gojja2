name: CI

# `make check` has always described itself as "everything CI should run".
# Nothing ran it: there was no workflow, so the conformance guarantee the README
# relies on -- that a known failure which starts passing fails the build -- held
# only when someone remembered. It did drift.
on:
  # Every commit that reaches main is built, whatever put it there. A pull
  # request is checked before merging, but that is not the same guarantee: the
  # first stack merge into this repository landed eleven commits without firing
  # a single run, because a push made by GitHub's own merge machinery does not
  # trigger workflows. Only a push event says what is actually on main.
  push:
    branches: [main]
  pull_request:
  # A safety net for the case above: if a merge lands without a run, this
  # notices within the day rather than at the next unrelated push.
  schedule:
    - cron: "17 5 * * *"
  # So a run can be asked for without an empty commit.
  workflow_dispatch:

# Read-only by default. Nothing here needs to write, and a fork pull request
# gets no secrets and no write token regardless -- this makes that explicit
# rather than relying on the repository setting staying where it is.
permissions:
  contents: read

concurrency:
  # One run per branch or pull request; a new push cancels the previous run,
  # except on main, where every commit's result is worth having.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Untrusted code does not run until somebody has looked at it.
  #
  # GitHub's own "require approval for outside collaborators" setting is the
  # right mechanism, and it cannot be used here: the API refuses it for a
  # private repository ("Fork PR approval is not allowed for private
  # repositories"). This gate does the same job in the workflow, so it holds
  # now and keeps holding if the repository is made public -- at which point
  # the native setting should be turned on as well, and this becomes a second
  # lock on the same door.
  #
  # A pull request from a branch in this repository needs write access to
  # create, so it is trusted. One from a fork is not, until a maintainer adds
  # the `safe-to-test` label -- which also takes write access.
  authorize:
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ steps.decide.outputs.trusted }}
    steps:
      - id: decide
        # The decision is made entirely in an Actions expression. Nothing
        # attacker-controlled -- a branch name, a title, an author -- is
        # interpolated into a shell command, because that is how a fork pull
        # request turns "we only read your code" into "we ran your code".
        env:
          TRUSTED: ${{ github.event_name != 'pull_request'
            || github.event.pull_request.head.repo.full_name == github.repository
            || contains(github.event.pull_request.labels.*.name, 'safe-to-test') }}
        run: |
          echo "trusted=$TRUSTED" >> "$GITHUB_OUTPUT"
          if [ "$TRUSTED" = "true" ]; then
            echo "Trusted source; running the full check." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Waiting for approval"
              echo
              echo "This pull request comes from a fork, so CI has not run."
              echo "A maintainer who has reviewed the diff can add the"
              echo '`safe-to-test` label to release it.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  check:
    needs: authorize
    if: needs.authorize.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # The toolchain is pinned in go.mod, down to the patch level.
          go-version-file: go.mod
          # Nothing to cache: this module has no dependencies, so there is
          # no go.sum and the cache step only warns about its absence.
          cache: false

      - name: Formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^third_party/' || true)
          if [ -n "$unformatted" ]; then
            echo "unformatted:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The committed corpus is graded with no network and no Python, so this
      # runs on a fresh checkout.
      - name: Test
        run: go test ./...

      # A second pass under a tight GOMEMLIMIT, which changes when the
      # collector runs and so exercises the allocation paths differently.
      #
      # -count=1 is not decoration. GOMEMLIMIT is read by the runtime rather
      # than through os.Getenv, so it is not part of the test cache key: this
      # step used to replay the step above and report every package as
      # "(cached)" in 0.134s, executing no test code at all.
      #
      # It is also not a cap in the sense the name would suggest. GOMEMLIMIT is
      # a *soft* limit -- the runtime collects harder rather than refusing an
      # allocation -- so a regression here shows up as a slow job and not as a
      # failure. What actually fails on one is the guards that measure the
      # property directly: TestSlicingCostsTheResultNotTheInput,
      # TestTupleHashIsLinear, TestLexingIsLinearInTheSource and the deep-graph
      # tests, which lower the stack ceiling rather than hoping the machine has
      # one.
      - name: Test again under a tight GOMEMLIMIT
        run: go test -count=1 ./...
        env:
          GOMEMLIMIT: 1GiB

      - name: Race
        run: go test -race ./...

      # Property fuzzing, which needs no oracle and therefore runs here.
      #
      # The differential fuzzer is sharper -- it is the one that can say what a
      # template *means* -- and it needs CPython with jinja2, which this runner
      # does not have. So the targets that can run on every commit are the ones
      # that check what holds regardless of meaning: do not panic, do not run
      # past the deadline, do not write past the bound, do not return an error
      # the caller cannot classify.
      #
      # The time is short because this is a regression gate rather than a
      # search: the committed corpus is replayed by `go test` above, and a
      # minute on top explores around it. A real hunt is `make fuzz-props
      # TIME=1h` on someone's machine, and what it finds is committed as a seed.
      - name: Fuzz
        run: |
          go test . -run xxx -fuzz FuzzParse -fuzztime 60s
          go test . -run xxx -fuzz FuzzRender -fuzztime 60s
          go test . -run xxx -fuzz FuzzAutoescape -fuzztime 60s

  lint:
    needs: authorize
    if: needs.authorize.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      # go vet does not report unused unexported functions, and three had
      # accumulated unnoticed.
      #
      # The action major must match the golangci-lint major: v6 installs a
      # 1.x, which cannot read this repository's v2 configuration and refuses
      # a go.mod newer than the Go it was built with. The version is pinned
      # rather than "latest" so that what CI runs is what was run locally.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
