name: Revoke CI approval

# Adding the `safe-to-test` label to a fork pull request is what runs CI on it:
# ci.yml's authorize job trusts the `labeled` event and nothing else from a
# fork, so a push never runs CI however the labels stand. A label is attached to
# the pull request rather than to a commit, though, so left in place it would
# look approved after a push. This removes it when the branch moves (a
# synchronize event), so the pull request shows what is true -- the new head
# has not been released -- and the next approval is an *add*, which is the event
# that runs. See docs/contributing.md, "Sending it".
on:
  pull_request_target:
    types: [synchronize]

# pull_request_target runs in the context of the base repository, so it has a
# writable token even for a fork. That combination is only safe because this
# workflow never checks out, builds or executes the pull request's code: it
# calls one API and exits. Do not add a checkout step here.
permissions:
  pull-requests: write

jobs:
  revoke:
    # Nothing to revoke for a branch in this repository, which was trusted
    # without a label in the first place.
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Remove safe-to-test
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 404 is the normal case: the label was not applied.
          gh api --method DELETE \
            "repos/$REPO/issues/$NUMBER/labels/safe-to-test" \
            --silent 2>/dev/null \
            && echo "Approval revoked: new commits need a fresh review." \
            || echo "No approval to revoke."
