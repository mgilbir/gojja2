name: Revoke CI approval

# The `safe-to-test` label marks a fork pull request as trusted: ci.yml's
# authorize job reads it from each run's event payload. A label is attached to
# the pull request, not to a commit, so on its own it keeps applying after new
# commits arrive -- which is the well-known hole in label-based gating: get the
# label on a harmless diff, then push whatever you like. This removes the label
# when the branch moves (a synchronize event). The same push also starts
# ci.yml's own synchronize run, concurrently with this one, and nothing in
# either workflow orders the deletion before that run reads its payload; see
# docs/contributing.md, "Sending it".
on:
  pull_request_target:
    types: [synchronize]

# pull_request_target runs in the context of the base repository, so it has a
# writable token even for a fork. That combination is only safe because this
# workflow never checks out, builds or executes the pull request's code: it
# calls one API and exits. Do not add a checkout step here.
permissions:
  pull-requests: write

jobs:
  revoke:
    # Nothing to revoke for a branch in this repository, which was trusted
    # without a label in the first place.
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Remove safe-to-test
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 404 is the normal case: the label was not applied.
          gh api --method DELETE \
            "repos/$REPO/issues/$NUMBER/labels/safe-to-test" \
            --silent 2>/dev/null \
            && echo "Approval revoked: new commits need a fresh review." \
            || echo "No approval to revoke."
